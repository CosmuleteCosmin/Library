<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>My Library</h1>
        <dialog id="book-dialog">
            <form id="book-form">
                <legend>Add New Book</legend>
                
                <label for="book">Book name:</label>
                <input type="text" id="book" 
                       pattern="[a-zA-Z0-9À-ÿ\s'.,\-!]+" 
                       title="Title can contain letters, numbers, and basic punctuation." 
                       required>
                
                <label for="author">Author:</label>
                <input type="text" id="author" 
                       pattern="[a-zA-ZÀ-ÿ\s'\-.]+" 
                       title="Author name can contain letters, spaces, dots, and hyphens." 
                       required>
                
                <label for="pages">Pages:</label>
                <input type="number" id="pages" min="1" value="1" required>
                
                <label for="status">Status:</label>
                <select id="status" required>
                    <option value="read">Read</option>
                    <option value="not-read" selected>Not Read</option>
                </select>

                <div class="form-buttons">
                    <button type="submit">Add Book</button>
                    <button type="button" autofocus id="cancel">Cancel</button>
                </div>
            </form>
        </dialog>
        <button id="new-book-btn">Add new book</button>
    </header>

    <main>
        <div id="library-container"></div>
    </main>
</body>
</html>
